name: Bygg og test
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['index.html', '**.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: node --test --test-timeout=900000 dist/tests/integration.test.js
      - run: npm run dist
      - name: Test GUI-et i den pakkede appen
        run: |
          npm install --no-save playwright-core@1.63.0
          node tests/e2e-win.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Snuttefanger-portable
          path: |
            release/*.exe
            release/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
      # Hver ny versjon i package.json blir en release automatisk. Finnes den fra før, røres den ikke.
      - name: Publiser release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG finnes allerede"
          else
            node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8');const m=s.split(/^## /m).find(x=>x.startsWith(process.argv[1].slice(1)+' '));process.stdout.write(m?m.split('\n').slice(1).join('\n').trim():'Se CHANGELOG.md.')" "$TAG" > notes.md
            gh release create "$TAG" release/*.exe --target "$GITHUB_SHA" --title "Snuttefanger $TAG" --notes-file notes.md
          fi
